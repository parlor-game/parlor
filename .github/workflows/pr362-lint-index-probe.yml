name: PR 362 focused live lint index verification

on:
  push:
    branches: [diagnostic/pr362-rationale-tap]
    paths:
      - .github/workflows/pr362-lint-index-probe.yml

permissions:
  contents: read

jobs:
  lint-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CANDIDATE: f9e1a12521c06cf0fda748e871ba13673f9fd5d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Verify recovery, exact inventory and live repositories
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lint-index-evidence"
          mkdir "$evidence"
          git worktree add --detach "$RUNNER_TEMP/lint-candidate" "$CANDIDATE"
          cd "$RUNNER_TEMP/lint-candidate"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          python3 -B -m unittest -v scripts.release.tests.test_android_lint_repository 2>&1 | tee "$evidence/tests.log"
          python3 -B scripts/generate_review_inventory.py --check | tee "$evidence/inventory.log"
          GITHUB_SHA="$CANDIDATE" python3 -B scripts/ci/android_lint_repository.py . 2>&1 | tee "$evidence/live-index.log"
          cp composeApp/build/reports/lint-repository-inputs-*.json "$evidence/"
          python3 -B - <<'PY' | tee "$evidence/canonical-alternate.log"
          from scripts.ci.android_lint_repository import MAVEN_CENTRAL_ALTERNATE, fetch_once, validate_central
          url = MAVEN_CENTRAL_ALTERNATE + "app/cash/turbine/turbine/maven-metadata.xml"
          validate_central(fetch_once(url), "app.cash.turbine", "turbine", "1.2.0")
          print(f"{url} returned the reviewed coordinate and version")
          PY
      - name: Retain unit results, source and live index receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr362-lint-index-focused
          path: ${{ runner.temp }}/lint-index-evidence/
          if-no-files-found: error
          retention-days: 14
