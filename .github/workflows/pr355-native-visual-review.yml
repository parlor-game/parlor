name: PR 355 Android visual evidence

on:
  push:
    branches: [test/pr355-native-visual-review]
    paths:
      - .github/workflows/pr355-native-visual-review.yml
      - scripts/android/capture_pr355_review.py

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_SHA: effb07ffffc6455a9d00c9107eb2e89864c8bea2
      BUILD_SHA: 349b6f64826aadb373b218da530719db0fda6d34
      SOURCE_TREE: 0a6270127adb2cb50dafaf9699f4e8f6f7f96a1d
      PRODUCER_RUN: '45335584746'
      PRODUCER_ARTIFACT: '14902655278'
      PRODUCER_DIGEST: b9404762067bda8c61c1683a36e4b2646ae374443be5091d0a27c921b5a5fe24
      AAB_DIGEST: 2cff911c6e9e8fe9c229bed6b508a239169cfbc4aac6ef28e72ba49840738fa6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
      - name: Verify and install the retained exact-tree release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/native-review
          git merge-base --is-ancestor "$APP_SHA" HEAD
          test "$(git rev-parse "$APP_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$APP_SHA" HEAD | tr '\n' ' ')" = ".github/workflows/pr355-native-visual-review.yml scripts/android/capture_pr355_review.py "
          gh api "repos/$GITHUB_REPOSITORY/commits/$BUILD_SHA" --jq '.commit.tree.sha' | grep -Fx "$SOURCE_TREE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/attempts/2" > "$RUNNER_TEMP/producer.json"
          jq -e --arg sha "$APP_SHA" '.event == "pull_request" and .workflow_id == 335554528 and .run_attempt == 2 and .conclusion == "success" and .head_sha == $sha' "$RUNNER_TEMP/producer.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT" > "$RUNNER_TEMP/artifact.json"
          jq -e --arg sha "$APP_SHA" --arg digest "sha256:$PRODUCER_DIGEST" --argjson run "$PRODUCER_RUN" '.name == "desktop-android-verification" and .expired == false and .digest == $digest and .workflow_run.head_sha == $sha and .workflow_run.id == $run' "$RUNNER_TEMP/artifact.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT/zip" > "$RUNNER_TEMP/producer.zip"
          printf '%s  %s\n' "$PRODUCER_DIGEST" "$RUNNER_TEMP/producer.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/producer.zip" parlor/parlor/build/ci-evidence/commit.txt | grep -Fx "$BUILD_SHA"
          unzip -p "$RUNNER_TEMP/producer.zip" parlor/parlor/composeApp/build/outputs/bundle/release/composeApp-release.aab > "$RUNNER_TEMP/parlor.aab"
          printf '%s  %s\n' "$AAB_DIGEST" "$RUNNER_TEMP/parlor.aab" | sha256sum -c -
          jq -r '.tools.bundletool.url' config/release-policy.json | xargs curl --fail --silent --show-error --location --proto '=https' --retry 2 --max-time 90 -o "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' "$(jq -r '.tools.bundletool.sha256' config/release-policy.json)" "$RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          keytool -genkeypair -keystore "$RUNNER_TEMP/lab.jks" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Parlor Visual Emulator'
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$RUNNER_TEMP/parlor.aab" --output="$RUNNER_TEMP/parlor.apks" --mode=universal --ks="$RUNNER_TEMP/lab.jks" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -p "$RUNNER_TEMP/parlor.apks" universal.apk > "$RUNNER_TEMP/parlor.apk"
          jq -n --arg source "$APP_SHA" --arg build "$BUILD_SHA" --arg tree "$SOURCE_TREE" \
            --arg harness "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg producer "$PRODUCER_RUN" \
            --arg artifact "$PRODUCER_ARTIFACT" --arg aab "$AAB_DIGEST" \
            --arg apk "$(sha256sum "$RUNNER_TEMP/parlor.apk" | cut -d ' ' -f1)" \
            '{pr_head:$source,producer_checkout:$build,source_tree:$tree,harness:$harness,run:$run,producer_run:$producer,producer_artifact:$artifact,aab_sha256:$aab,lab_apk_sha256:$apk}' > evidence/native-review/source.json
      - name: Capture installed game entries and local game setup in two profiles
        shell: bash
        env:
          FOCUSED_GAME: word-impostor
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/review-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-35;google_apis;x86_64'
          "$sdk/sdkmanager" 'platform-tools' 'emulator' "$image"
          echo no | "$sdk/avdmanager" create avd --force --name parlor-review --device pixel_4 --package "$image"
          "$ANDROID_HOME/emulator/emulator" -avd parlor-review -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > evidence/native-review/emulator.log 2>&1 &
          emulator=$!
          timeout 360 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator"
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          adb -s emulator-5554 install "$RUNNER_TEMP/parlor.apk"
          installed="$(adb -s emulator-5554 shell pm path me.parlor.android | sed -n 's/^package://p' | tr -d '\r')"
          adb -s emulator-5554 pull "$installed" "$RUNNER_TEMP/installed.apk" >/dev/null
          cmp "$RUNNER_TEMP/installed.apk" "$RUNNER_TEMP/parlor.apk"
          printf '%s\n' 'Installed base APK matches the verified universal APK byte for byte.' > evidence/native-review/install.txt
          python3 scripts/android/capture_pr355_review.py evidence/native-review "$FOCUSED_GAME"
      - name: Upload screenshots and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr355-android-native-review
          path: evidence/native-review/
          if-no-files-found: error
          retention-days: 14
