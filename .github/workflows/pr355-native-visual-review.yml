name: PR 355 Android visual evidence

on:
  push:
    branches: [test/pr355-native-visual-review]
    paths:
      - .github/workflows/pr355-native-visual-review.yml
      - scripts/android/capture_pr355_review.py

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_SHA: d2a55eb5f4880798b6e07377df249e370dd2ff11
      PARLOR_APP_ID: me.parlor.android.debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
      - name: Build the exact layout fix with strict dependency verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/native-review
          git merge-base --is-ancestor "$APP_SHA" HEAD
          git worktree add --detach "$RUNNER_TEMP/parlor-src" "$APP_SHA"
          (
            cd "$RUNNER_TEMP/parlor-src"
            test "$(git rev-parse HEAD)" = "$APP_SHA"
            ./gradlew :composeApp:assembleDebug --dependency-verification=strict --no-configuration-cache --console=plain
          )
          cp "$RUNNER_TEMP/parlor-src/composeApp/build/outputs/apk/debug/composeApp-debug.apk" "$RUNNER_TEMP/parlor.apk"
          jq -n --arg source "$APP_SHA" --arg tree "$(git rev-parse "$APP_SHA^{tree}")" \
            --arg harness "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg apk "$(sha256sum "$RUNNER_TEMP/parlor.apk" | cut -d ' ' -f1)" \
            '{app_sha:$source,source_tree:$tree,harness:$harness,run:$run,lab_apk_sha256:$apk}' > evidence/native-review/source.json
      - name: Capture the Arabic Whodunit story picker at 320 dp and 200 percent text
        shell: bash
        env:
          FOCUSED_GAME: whodunit
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/review-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-35;google_apis;x86_64'
          "$sdk/sdkmanager" 'platform-tools' 'emulator' "$image"
          echo no | "$sdk/avdmanager" create avd --force --name parlor-review --device pixel_4 --package "$image"
          "$ANDROID_HOME/emulator/emulator" -avd parlor-review -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > evidence/native-review/emulator.log 2>&1 &
          emulator=$!
          timeout 360 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator"
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          adb -s emulator-5554 install "$RUNNER_TEMP/parlor.apk"
          installed="$(adb -s emulator-5554 shell pm path "$PARLOR_APP_ID" | sed -n 's/^package://p' | tr -d '\r')"
          adb -s emulator-5554 pull "$installed" "$RUNNER_TEMP/installed.apk" >/dev/null
          cmp "$RUNNER_TEMP/installed.apk" "$RUNNER_TEMP/parlor.apk"
          printf '%s\n' 'Installed base APK matches the strictly built debug APK byte for byte.' > evidence/native-review/install.txt
          python3 scripts/android/capture_pr355_review.py evidence/native-review "$FOCUSED_GAME"
      - name: Upload screenshots and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr355-whodunit-native-layout-fix
          path: evidence/native-review/
          if-no-files-found: error
          retention-days: 14
