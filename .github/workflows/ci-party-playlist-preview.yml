name: Party playlist editing preview

on:
  push:
    branches: [work/party-night-main-integration]
    paths:
      - .github/workflows/ci-party-playlist-preview.yml
      - 'composeApp/src/commonMain/kotlin/com/parlor/app/shell/party/**'
      - 'composeApp/src/commonMain/composeResources/values*/strings.xml'
      - 'composeApp/src/desktopTest/kotlin/com/parlor/app/shell/party/**'
      - 'shared/session/src/common*/kotlin/com/parlor/session/lobby/**'

permissions:
  contents: read

jobs:
  playlist:
    name: Host playlist edits and peer progress
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify the affected session and Compose journeys
        env:
          GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
        run: |
          set -euo pipefail
          evidence=build/party-playlist-evidence
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} > "$evidence/source.txt"
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" ]]; then
            sdkmanager --install 'platforms;android-36'
          fi
          ./gradlew \
            :shared:session:desktopTest --tests '*PartyLobbyTest' --tests '*PartyHostRoomBindingTest' \
            :composeApp:desktopTest --tests '*PartyPlaylistJourneyTest' --tests '*PartyLobbyRenderingTest' \
            --dependency-verification=strict --no-daemon --stacktrace --console=plain | tee "$evidence/gradle.log"
      - name: Retain source-bound Party JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: party-playlist-editing-preview
          path: |
            build/party-playlist-evidence/
            composeApp/build/test-results/desktopTest/TEST-*.xml
            shared/session/build/test-results/desktopTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 14
