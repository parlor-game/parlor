name: Party match completion preview

on:
  push:
    branches: [work/party-night-main-integration]
    paths:
      - .github/workflows/ci-party-completion-preview.yml
      - 'game-modes/mafia/src/**'
      - 'game-modes/whodunit/src/**'

permissions:
  contents: read

jobs:
  completion:
    name: Mafia and Whodunit match completion
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify the affected game completion suites
        env:
          GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" ]]; then
            sdkmanager --install 'platforms;android-36'
          fi
          ./gradlew \
            :game-modes:mafia:desktopTest --tests '*MafiaReducerEdgeCasesTest' \
            :game-modes:whodunit:desktopTest --tests '*ContinueWithoutPlayerTest' \
            --dependency-verification=strict --no-daemon --stacktrace --console=plain
      - name: Retain game completion JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: party-match-completion-preview
          path: |
            game-modes/mafia/build/test-results/desktopTest/TEST-*.xml
            game-modes/whodunit/build/test-results/desktopTest/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
