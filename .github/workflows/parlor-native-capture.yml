name: Parlor native UI capture

on:
  push:
    branches: [capture/native-screens-2026-11-22]
    paths:
      - .github/workflows/parlor-native-capture.yml
      - evidence/screenshots/**

permissions:
  contents: read

jobs:
  capture-android:
    if: ${{ !startsWith(github.event.head_commit.message, 'Upload captured native evidence') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
      - name: Build Android debug app
        run: ./gradlew :composeApp:assembleDebug --dependency-verification=strict --no-configuration-cache
      - name: Boot emulator and capture public app routes
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-35;google_apis;x86_64'
          "$tools/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/parlor-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force --name parlor-capture --device pixel_2 --package "$image" --path "$ANDROID_AVD_HOME/parlor-capture.avd"
          "$ANDROID_HOME/emulator/emulator" -avd parlor-capture -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/parlor-emulator.log" 2>&1 &
          emulator_pid=$!
          if ! timeout 360 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator_pid"; then
            cat "$RUNNER_TEMP/parlor-emulator.log"
            exit 1
          fi
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          adb -s emulator-5554 shell settings put system font_scale 1.0
          adb -s emulator-5554 shell wm size 1080x2400
          adb -s emulator-5554 shell wm density 420
          python3 scripts/android/capture_public_screens.py --device emulator-5554 --output evidence/screenshots/android
          printf '{"platform":"Android Emulator","runner":"ubuntu-24.04","device":"Pixel 2 API 35 x86_64","viewport_px":"1080x2400","font_scale":1.0,"source_sha":"%s","method":"adb install/launch, uiautomator accessibility-tree targeting, adb screencap"}\n' "$(git rev-parse HEAD)" > evidence/screenshots/android/provenance.json
      - name: Upload Android emulator PNG evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parlor-native-android-${{ github.sha }}
          path: evidence/screenshots/android/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  capture-ios:
    if: ${{ !startsWith(github.event.head_commit.message, 'Upload captured native evidence') }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
      - name: Create a clean iPhone simulator and run UI capture tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/screenshots/ios build/capture
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
          xcrun simctl list devices available -j > build/capture/simulators.json
          simulator="$(python3 - build/capture/simulators.json <<'PYTHON'
          import json
          import sys
          devices = json.load(open(sys.argv[1], encoding="utf-8"))["devices"]
          print(next(device["udid"] for runtime in sorted(devices, reverse=True) if ".iOS-" in runtime
                     for device in devices[runtime]
                     if device["name"].startswith("iPhone") and device["isAvailable"]))
          PYTHON
          )"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl status_bar "$simulator" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath build/ios-derived -resultBundlePath build/capture/ios-ui-capture.xcresult \
            -only-testing:iosAppUITests/IOSAppLaunchUITests test | tee build/capture/xcodebuild.log
          xcrun xcresulttool export attachments --path build/capture/ios-ui-capture.xcresult \
            --output-path evidence/screenshots/ios/attachments
          printf '{"platform":"iOS Simulator","runner":"macos-15 arm64","device":"iPhone simulator (runtime and model recorded in job log)","source_sha":"%s","method":"XCTest UI navigation and XCTAttachment app screenshots exported from xcresult"}\n' "$(git rev-parse HEAD)" > evidence/screenshots/ios/provenance.json
      - name: Upload iOS Simulator PNG evidence and result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parlor-native-ios-${{ github.sha }}
          path: |
            evidence/screenshots/ios/
            build/capture/xcodebuild.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  upload-captured-evidence:
    if: ${{ startsWith(github.event.head_commit.message, 'Upload captured native evidence') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify evidence package
        run: |
          test -s evidence/screenshots/manifest.json
          test -s evidence/screenshots/index.html
          test "$(find evidence/screenshots -type f -name '*.png' | wc -l)" -gt 0
      - name: Upload reviewed PNGs, gallery, and route manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parlor-full-app-screens-native-${{ github.sha }}
          path: evidence/screenshots/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
