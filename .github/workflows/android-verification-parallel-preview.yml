name: Android verification parallel preview

on:
  push:
    branches: [perf/android-verification-parallel]
    paths: [.github/workflows/android-verification-parallel-preview.yml]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  desktop-android:
    name: 'Android verification (${{ matrix.lane }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        lane: [common-and-package]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review-inventory gate derives per-file findings from the
          # accepted review baseline, so this job needs that history.
          fetch-depth: 0
          persist-credentials: false
          ref: 2453a32743103b444820640ab36370f26050e7ac
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
          problem-matcher: true
      - name: Reclaim unused standard Linux runner toolchains
        run: python3 -B scripts/ci/hosted_linux_capacity.py
      - name: Restore reviewed Gradle dependencies
        id: dependency_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v2-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            parlor-deps-v2-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Claim fresh verification output ownership
        id: verification_ownership
        shell: python
        run: |
          import runpy, sys
          sys.argv = ["verification_hygiene.py", "prepare"]
          runpy.run_path("scripts/ci/verification_hygiene.py", run_name="__main__")
      - name: Install pinned Android SDK packages
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          managed_device_image=$(jq -r '.toolchains.android_managed_device.system_image_package' config/release-policy.json)
          test "$managed_device_image" = "system-images;android-35;google_apis;x86_64"
          navigation_device_image=$(jq -r '.toolchains.android_navigation_device.system_image_package' config/release-policy.json)
          test "$navigation_device_image" = "system-images;android-34;google_apis;x86_64"
          # Install both required lanes before spending time on compilation.
          # Do not let AGP fetch an unreviewed/missing image halfway through tests.
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "$managed_device_image" \
            "$navigation_device_image"
          image_properties="${ANDROID_HOME}/system-images/android-35/google_apis/x86_64/source.properties"
          test -s "$image_properties"
          image_revision=$(sed -n 's/^Pkg.Revision=//p' "$image_properties" | tr -d '\r')
          test "$image_revision" = "$(jq -r '.toolchains.android_managed_device.system_image_revision' config/release-policy.json)"
          image_properties="${ANDROID_HOME}/system-images/android-34/google_apis/x86_64/source.properties"
          test -s "$image_properties"
          image_revision=$(sed -n 's/^Pkg.Revision=//p' "$image_properties" | tr -d '\r')
          test "$image_revision" = "$(jq -r '.toolchains.android_navigation_device.system_image_revision' config/release-policy.json)"
      - name: Record exact source and require a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          git rev-parse HEAD | tee build/ci-evidence/commit.txt
          test -z "$(git status --porcelain)"
      - name: Record the exact lint-fix source and preview harness
        shell: bash
        env:
          DEPENDENCY_CACHE_KEY: ${{ steps.dependency_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2453a32743103b444820640ab36370f26050e7ac"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > build/ci-evidence/source.txt
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > build/ci-evidence/harness-sha.txt
          printf '%s\n' "$DEPENDENCY_CACHE_KEY" > build/ci-evidence/dependency-cache-key.txt
      - name: Verify the bounded live lint retry contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v scripts.release.tests.test_android_lint_repository \
            2>&1 | tee build/ci-evidence/lint-repository-tests.log
      - name: Run common, desktop, Android, static-analysis, and release gates
        if: matrix.lane == 'common-and-package'
        run: ./gradlew productionCheck productionStaticAnalysis productionReleaseAutomationCheck allTests --dependency-verification=strict --no-daemon --stacktrace --console=plain
      - name: Stop Gradle after common-android
        if: matrix.lane == 'common-and-package'
        shell: python
        run: |
          import runpy, sys
          sys.argv = ["verification_hygiene.py", "stop", "common-android"]
          runpy.run_path("scripts/ci/verification_hygiene.py", run_name="__main__")
      - name: Inspect unsigned Android release artifact and merged manifest
        if: matrix.lane == 'common-and-package'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find composeApp/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print)
          test "${#aabs[@]}" -eq 1
          aab="${aabs[0]}"
          unzip -t "$aab"
          unzip -l "$aab" | grep -Fq 'base/manifest/AndroidManifest.xml'
          unzip -l "$aab" | grep -Fq 'base/dex/classes.dex'
          manifest="composeApp/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          test -s "$manifest"
          sha256sum "$aab" | tee build/ci-evidence/android-aab.sha256
          cp "$manifest" build/ci-evidence/merged-release-manifest.xml
          python3 -B scripts/verification/third_party_notices.py --package "$aab" --json >build/ci-evidence/android-release-notices.json
          tools=$(mktemp -d "${RUNNER_TEMP}/parlor-unsigned-aab-tools.XXXXXX")
          trap 'rm -rf "$tools"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --max-filesize 134217728 --max-time 120 --retry 3 \
            "$(jq -r '.tools.bundletool.url' config/release-policy.json)" -o "$tools/bundletool.jar"
          python3 -B scripts/verification/android_release_artifacts.py --package "$aab" \
            --bundletool "$tools/bundletool.jar" --dexdump "$ANDROID_HOME/build-tools/36.0.0/dexdump" \
            >build/ci-evidence/android-release-artifact-inventory.json
      - name: Run release Android managed-device smoke tests
        if: matrix.lane == 'installed-runtime'
        shell: bash
        run: scripts/android/run_release_managed_device_smoke.sh
      - name: Stop Gradle after managed-device
        if: matrix.lane == 'installed-runtime'
        shell: python
        run: |
          import runpy, sys
          sys.argv = ["verification_hygiene.py", "stop", "managed-device"]
          runpy.run_path("scripts/ci/verification_hygiene.py", run_name="__main__")
      - name: Verify Android saved-session removal across process restart
        if: matrix.lane == 'installed-runtime'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/android/supervise_managed_device.py \
            --receipt build/ci-evidence/android-process-device-supervision.json \
            --isolated-avd -- \
            python3 -B -m scripts.android.run_resume_process_acceptance \
              --output build/ci-evidence/android-process-acceptance
      - name: Upload verification reports, mappings, and unsigned AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-verification-${{ matrix.lane }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci-evidence/
            **/build/reports/detekt/
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-ownership.json
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-hosted-disk.json
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-stop-*.json
            **/build/reports/androidTests/managedDevice/
            **/build/outputs/androidTest-results/managedDevice/
            **/build/reports/lint-results-*
            composeApp/build/reports/lint-repository-inputs-*.json
            composeApp/build/outputs/mapping/release/
            composeApp/build/outputs/bundle/release/*.aab
            !remediation-runs/**
            !docs/archives/**

      # A successful nonempty upload must precede deletion of the last local evidence copy.
