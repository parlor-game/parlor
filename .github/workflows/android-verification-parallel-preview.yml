name: Isolated API 35 managed Release Lavapipe preview

on:
  push:
    branches: [perf/android-verification-parallel]
    paths: [.github/workflows/android-verification-parallel-preview.yml]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  release-runtime:
    name: API 35 managed Release smoke with Lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      CANDIDATE: f9e1a12521c06cf0fda748e871ba13673f9fd5d8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the tracked PR source
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = 835686c1fad50d787e0bb34386ec7ffe85c1b5af
          test -z "$(git status --porcelain)"
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
          problem-matcher: true
      - name: Record available disk for the single API 35 image
        run: |
          mkdir -p build/ci-evidence
          df -Pk "$ANDROID_HOME" "$GITHUB_WORKSPACE" > build/ci-evidence/disk-before-sdk.txt
      - name: Restore reviewed Gradle dependencies
        id: dependency_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v2-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            parlor-deps-v2-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Install pinned Android SDK packages
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          if ! dpkg-query -W -f='${db:Status-Status}' libpulse0 2>/dev/null | grep -Fxq installed; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpulse0
          fi
          release_device_image=$(jq -r '.toolchains.android_managed_device.system_image_package' config/release-policy.json)
          test "$release_device_image" = "system-images;android-35;google_apis;x86_64"
          # Do not let AGP fetch an unreviewed/missing image halfway through tests.
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "$release_device_image"
          image_properties="${ANDROID_HOME}/system-images/android-35/google_apis/x86_64/source.properties"
          test -s "$image_properties"
          image_revision=$(sed -n 's/^Pkg.Revision=//p' "$image_properties" | tr -d '\r')
          test "$image_revision" = "$(jq -r '.toolchains.android_managed_device.system_image_revision' config/release-policy.json)"
      - name: Record exact source and require a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          git rev-parse HEAD | tee build/ci-evidence/commit.txt
          test -z "$(git status --porcelain)"
      - name: Run the original managed Release arm with Lavapipe
        shell: bash
        env:
          DEPENDENCY_CACHE_KEY: ${{ steps.dependency_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git rev-parse HEAD HEAD^{tree} > build/ci-evidence/source.txt
          printf '%s\n' "$GITHUB_SHA" > build/ci-evidence/harness.txt
          printf '%s\n' "$DEPENDENCY_CACHE_KEY" > build/ci-evidence/dependency-cache-key.txt
          "$ANDROID_HOME/emulator/emulator" -version > build/ci-evidence/emulator-version.txt 2>&1

          # Retain the production Release command, signing, test scope and
          # cleanup. Change only its renderer and stop before the Debug arm.
          original=scripts/android/run_release_managed_device_smoke.sh
          preview=build/ci-evidence/release-only-runtime.sh
          awk '/^# R8 may remove\/internalize APIs/ { exit } { print }' "$original" > "$preview"
          test "$(grep -Fc 'emulator.gpu=swiftshader' "$preview")" -eq 1
          sed -i 's/emulator.gpu=swiftshader/emulator.gpu=lavapipe/' "$preview"
          grep -F 'productionAndroidRuntimeCheck' "$preview"
          awk '$1 == "oom_kill" {print $2}' /proc/vmstat > build/ci-evidence/host-oom-before.txt
          status=0
          bash "$preview" || status=$?
          awk '$1 == "oom_kill" {print $2}' /proc/vmstat > build/ci-evidence/host-oom-after.txt
          exit "$status"
      - name: Upload managed API 35 and supervision evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-api35-release-lavapipe
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ci-evidence/
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            **/build/reports/androidTests/managedDevice/
            **/build/outputs/androidTest-results/managedDevice/
            !remediation-runs/**
            !docs/archives/**
