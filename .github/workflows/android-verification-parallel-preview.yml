name: Isolated API 34 managed-device Lavapipe preview

on:
  push:
    branches: [perf/android-verification-parallel]
    paths: [.github/workflows/android-verification-parallel-preview.yml]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  navigation-runtime:
    name: API 34 managed Debug navigation and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
          problem-matcher: true
      - name: Record available disk for the single API 34 image
        run: |
          mkdir -p build/ci-evidence
          df -Pk "$ANDROID_HOME" "$GITHUB_WORKSPACE" > build/ci-evidence/disk-before-sdk.txt
      - name: Restore reviewed Gradle dependencies
        id: dependency_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v2-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            parlor-deps-v2-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Install pinned Android SDK packages
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          if ! dpkg-query -W -f='${db:Status-Status}' libpulse0 2>/dev/null | grep -Fxq installed; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpulse0
          fi
          navigation_device_image=$(jq -r '.toolchains.android_navigation_device.system_image_package' config/release-policy.json)
          test "$navigation_device_image" = "system-images;android-34;google_apis;x86_64"
          # Do not let AGP fetch an unreviewed/missing image halfway through tests.
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "$navigation_device_image"
          image_properties="${ANDROID_HOME}/system-images/android-34/google_apis/x86_64/source.properties"
          test -s "$image_properties"
          image_revision=$(sed -n 's/^Pkg.Revision=//p' "$image_properties" | tr -d '\r')
          test "$image_revision" = "$(jq -r '.toolchains.android_navigation_device.system_image_revision' config/release-policy.json)"
      - name: Record exact source and require a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          git rev-parse HEAD | tee build/ci-evidence/commit.txt
          test -z "$(git status --porcelain)"
      - name: Verify the exact Android-only harness changes
        shell: bash
        env:
          DEPENDENCY_CACHE_KEY: ${{ steps.dependency_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          diff -u <(printf '%s\n' '.github/workflows/android-verification-parallel-preview.yml' 'scripts/android/run_release_managed_device_smoke.sh') \
            <(git diff --name-only 0c1b824158884857f15b69e56bebb933e2ec9134 HEAD)
          git rev-parse HEAD HEAD^{tree} > build/ci-evidence/source.txt
          printf '%s\n' "$DEPENDENCY_CACHE_KEY" > build/ci-evidence/dependency-cache-key.txt
      - name: Build the exact navigation app and instrumentation pair
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -version > build/ci-evidence/emulator-version.txt 2>&1
          ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest \
            -Pparlor.androidRuntimeTestVariant=debug --dependency-verification=strict \
            --no-daemon --max-workers=2 --console=plain
          sha256sum composeApp/build/outputs/apk/debug/*.apk composeApp/build/outputs/apk/androidTest/debug/*.apk \
            > build/ci-evidence/navigation-apks.sha256
      - name: Run all managed API 34 tests with Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          awk '$1 == "oom_kill" {print $2}' /proc/vmstat > build/ci-evidence/host-oom-before.txt
          status=0
          python3 -B scripts/android/supervise_managed_device.py \
            --receipt build/ci-evidence/android-navigation-device-supervision.json \
            --gradle-setup-task :composeApp:pixel2Api34Setup --isolated-avd -- \
            ./gradlew productionAndroidNavigationRuntimeCheck \
              -Pparlor.androidRuntimeTestVariant=debug \
              -Pandroid.testoptions.manageddevices.emulator.gpu=lavapipe \
              --dependency-verification=strict --no-daemon --max-workers=2 \
              --info --stacktrace --console=plain \
              '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' || status=$?
          awk '$1 == "oom_kill" {print $2}' /proc/vmstat > build/ci-evidence/host-oom-after.txt
          exit "$status"
      - name: Upload managed API 34 and supervision evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-api34-managed-lavapipe
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ci-evidence/
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            **/build/reports/androidTests/managedDevice/
            **/build/outputs/androidTest-results/managedDevice/
            !remediation-runs/**
            !docs/archives/**
