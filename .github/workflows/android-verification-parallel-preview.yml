name: Android verification parallel preview

on:
  push:
    branches: [perf/android-verification-parallel]
    paths: [.github/workflows/android-verification-parallel-preview.yml]

permissions:
  contents: read

jobs:
  metadata:
    name: Live lint metadata preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: d7ef26d1dabc31497d11c34d0b71a99974113942
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v2-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts') }}
      - name: Record source and verify the focused controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd7ef26d1dabc31497d11c34d0b71a99974113942'
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p build/ci-evidence
          git rev-parse HEAD HEAD^{tree} > build/ci-evidence/source.txt
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > build/ci-evidence/harness-sha.txt
          python3 -B scripts/generate_review_inventory.py --check | tee build/ci-evidence/review-inventory.txt
          python3 -B -m unittest -v scripts.release.tests.test_android_lint_repository \
            2>&1 | tee build/ci-evidence/lint-repository-tests.log
      - name: Fetch and validate the mandatory live indexes through Gradle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :composeApp:prepareReleaseLintRepositoryInputs --dependency-verification=strict \
            --no-daemon --console=plain 2>&1 | tee build/ci-evidence/gradle-live-index.log
      - name: Upload source, metadata and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-lint-metadata-preflight
          path: |
            build/ci-evidence/
            composeApp/build/reports/lint-repository-inputs-*.json
          if-no-files-found: error
          retention-days: 14
