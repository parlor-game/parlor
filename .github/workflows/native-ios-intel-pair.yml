name: Two installed Parlor apps on one Intel Simulator runner
on:
  push:
    branches: [test/distributed-smart-lobby]
    paths: [scripts/smart-lobby-native/intel-pair-dispatch.json]

permissions:
  contents: read
  actions: read

jobs:
  lab:
    runs-on: macos-15-intel
    timeout-minutes: 100
    env:
      TARGET: ios
      DEVICE_COUNT: '2'
      STAGED_IOS_PAIR: 'true'
      PARLOR_IOS_BUILD_ARCH: x86_64
      PARLOR_NATIVE_DIAGNOSTICS: '1'
      PARLOR_NATIVE_CONFIG: scripts/smart-lobby-native/intel-pair-dispatch.json
      PARLOR_PREBOOTED_INTEL: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CANDIDATE: 0438fc6ff53780e87fa111f68352b15dd44a3ec3
      LAN_UI_DIR: ${{ github.workspace }}/ui-client
      PYTHONPATH: ${{ github.workspace }}/ui-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage two iOS 26.2 devices provided by the macOS 15 Intel image
        run: python3 scripts/smart-lobby-native/dual_intel_probe.py --keep-preinstalled
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ui-test-actions/ui-test-actions
          ref: 0c818c5d72e8c30c59bd1287c330a40392bf8e89
          path: ui-client
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: producer
        name: Verify the original Intel build by numeric run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r .candidate "$PARLOR_NATIVE_CONFIG")" = "$CANDIDATE"
          test "$(jq -r .pairing "$PARLOR_NATIVE_CONFIG")" = ios
          run=$(jq -r .producer_run "$PARLOR_NATIVE_CONFIG")
          source=$(jq -r .producer_harness "$PARLOR_NATIVE_CONFIG")
          [[ "$run" =~ ^[0-9]+$ && "$source" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/parlor-game/parlor/actions/runs/$run" | jq -e --argjson run "$run" --arg source "$source" '
            .id == $run and .workflow_id == 428412678 and .repository.full_name == "parlor-game/parlor"
            and .head_repository.full_name == "parlor-game/parlor" and .status == "completed"
            and .conclusion == "success" and .event == "push" and .head_branch == "test/distributed-smart-lobby"
            and .head_sha == $source
          ' >/dev/null
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: parlor-game/parlor
          run-id: ${{ steps.producer.outputs.run }}
          name: candidate-ios-intel-1
          path: ${{ runner.temp }}/parlor-package
      - name: Stage and verify two independent native Parlor installs
        run: bash scripts/smart-lobby-native/lab.sh install
      - name: Measure each guest clock
        run: python3 scripts/smart-lobby-native/diagnostics.py clock-before
      - id: controllers
        name: Open two independent native accessibility controllers
        run: python3 scripts/smart-lobby-native/lab.py start
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parlor-intel-native-ui
          path: ${{ runner.temp }}/parlor-connections
          if-no-files-found: error
          retention-days: 1
      - name: Keep both installed apps available for gameplay
        run: python3 scripts/smart-lobby-native/lab.py hold
      - name: Retain redacted native app transactions
        if: always() && steps.controllers.outcome == 'success'
        run: python3 scripts/smart-lobby-native/diagnostics.py capture
      - name: Remove the two job-owned simulators
        if: always()
        env:
          LAB_PAIRING: ios
        run: bash scripts/smart-lobby-native/lab.sh cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parlor-intel-native-proof
          path: ${{ runner.temp }}/parlor-proof
          if-no-files-found: error
          retention-days: 7
