name: Build exact Parlor debug app for Intel Simulator
on:
  push:
    branches: [test/distributed-smart-lobby]
    paths: [scripts/smart-lobby-native/intel-candidate.txt]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 70
    env:
      TARGET: ios
      PARLOR_IOS_BUILD_ARCH: x86_64
      GRADLE_OPTS: >-
        -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: source
        name: Verify the candidate reference
        shell: bash
        run: |
          read -r candidate < scripts/smart-lobby-native/intel-candidate.txt
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and hash the Intel Simulator package
        shell: bash
        env:
          CANDIDATE: ${{ steps.source.outputs.candidate }}
        run: bash scripts/smart-lobby-native/lab.sh build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-ios-intel-1
          path: ${{ runner.temp }}/parlor-package
          if-no-files-found: error
          retention-days: 7
