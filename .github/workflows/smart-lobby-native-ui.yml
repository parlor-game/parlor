name: Smart Lobby installed app LAN lab
on:
  workflow_dispatch:
    inputs:
      pairing:
        description: Native pairing
        type: choice
        options: [android, ios, mixed]
        required: true
      token_digests:
        description: JSON array of one SHA-256 bearer digest per device
        type: string
        required: true
  push:
    branches: [test/smart-lobby-native-ui]
    paths: [scripts/smart-lobby-native/dispatch.json]

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      lab: ${{ steps.plan.outputs.lab }}
      rules_restore_android: ${{ steps.plan.outputs.rules_restore_android }}
      reuse_presets_android: ${{ steps.plan.outputs.reuse_presets_android }}
      reuse_candidate: ${{ steps.plan.outputs.reuse_candidate }}
      build_only: ${{ steps.plan.outputs.build_only }}
      reuse_pr356: ${{ steps.plan.outputs.reuse_pr356 }}
      reuse_pr355: ${{ steps.plan.outputs.reuse_pr355 }}
      observe_reconnect: ${{ steps.plan.outputs.observe_reconnect }}
      staged_ios_pair: ${{ steps.plan.outputs.staged_ios_pair }}
      extended_match: ${{ steps.plan.outputs.extended_match }}
      ios_retained_run: ${{ steps.plan.outputs.ios_retained_run }}
      candidate: ${{ steps.plan.outputs.candidate }}
      retained_party_night_run: ${{ steps.plan.outputs.retained_party_night_run }}
      visible_ios_window: ${{ steps.plan.outputs.visible_ios_window }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        shell: bash
        env:
          PAIRING: ${{ inputs.pairing }}
          DIGESTS: ${{ inputs.token_digests }}
        run: python3 scripts/smart-lobby-native/lab.py plan

  build:
    needs: plan
    if: needs.plan.outputs.reuse_candidate != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    env:
      TARGET: ${{ matrix.target }}
      CANDIDATE: ${{ needs.plan.outputs.candidate }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build the exact source and bind the binary to it
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=2
        run: bash scripts/smart-lobby-native/lab.sh build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.target }}-1
          path: ${{ runner.temp }}/parlor-package
          if-no-files-found: error
          retention-days: 7

  lab:
    needs: [plan, build]
    if: >-
      ${{ always() && !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.build_only != 'true' &&
          (needs.build.result == 'success' ||
            (needs.build.result == 'skipped' && needs.plan.outputs.reuse_candidate == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lab) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ needs.plan.outputs.extended_match == 'true' && 170 || 100 }}
    env:
      TARGET: ${{ matrix.target }}
      PAIRING: ${{ inputs.pairing }}
      DIGESTS: ${{ inputs.token_digests }}
      CANDIDATE: ${{ needs.plan.outputs.candidate }}
      DEVELOPER_DIR: ${{ matrix.target == 'ios' && '/Applications/Xcode_26.3.app/Contents/Developer' || '' }}
      LAN_KEEP: '1'
      LAN_FAULTS: ${{ needs.plan.outputs.observe_reconnect == 'true' && '1' || '0' }}
      STAGED_IOS_PAIR: ${{ needs.plan.outputs.staged_ios_pair }}
      VISIBLE_IOS_WINDOW: ${{ needs.plan.outputs.visible_ios_window }}
      PARLOR_UI_DURATION: ${{ needs.plan.outputs.extended_match == 'true' && '150' || '80' }}
      LAN_UI_DIR: ${{ github.workspace }}/ui-client
      PYTHONPATH: ${{ github.workspace }}/ui-client
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ui-test-actions/ui-test-actions
          ref: 0c818c5d72e8c30c59bd1287c330a40392bf8e89
          persist-credentials: false
          path: ui-client
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.observe_reconnect != 'true' && matrix.target == 'android' && needs.plan.outputs.reuse_presets_android != 'true' && needs.plan.outputs.rules_restore_android != 'true'
        with:
          github-token: ${{ github.token }}
          repository: parlor-game/parlor
          run-id: '45075164525'
          name: candidate-android-1
          path: ${{ runner.temp }}/parlor-package
      - name: Verify the original exact presets Android build
        if: needs.plan.outputs.reuse_presets_android == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/parlor-game/parlor/actions/runs/45372545043/attempts/1 | jq -e '
            .id == 45372545043 and .workflow_id == 427081574 and .run_attempt == 1 and
            .repository.full_name == "parlor-game/parlor" and .head_repository.full_name == "parlor-game/parlor" and
            .head_branch == "test/smart-lobby-native-ui" and .head_sha == "4216fa7454d40e3cbcc65448f493e43f23bc0645"' >/dev/null
          gh api repos/parlor-game/parlor/actions/jobs/138370474137 | jq -e '
            .run_id == 45372545043 and .run_attempt == 1 and .conclusion == "success" and
            .name == "build (android, ubuntu-24.04)"' >/dev/null
          gh api repos/parlor-game/parlor/actions/artifacts/14910227656 | jq -e '
            .name == "candidate-android-1" and .digest == "sha256:4bc50dc1cfff39d047816943fc06ebd3aaab1685baf18efce9202380a2a5620e" and .expired == false and
            .workflow_run.id == 45372545043 and .workflow_run.head_sha == "4216fa7454d40e3cbcc65448f493e43f23bc0645"' >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.reuse_presets_android == 'true'
        with:
          github-token: ${{ github.token }}
          repository: parlor-game/parlor
          run-id: '45372545043'
          name: candidate-android-1
          path: ${{ runner.temp }}/parlor-package
      - name: Check the retained package uses the exact successful build producer
        if: needs.plan.outputs.staged_ios_pair == 'true' || (needs.plan.outputs.extended_match == 'true' && needs.plan.outputs.reuse_candidate == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/parlor-game/parlor/actions/runs/45121464371 | jq -e '
            .id == 45121464371 and .workflow_id == 427081574 and .run_attempt == 1 and
            .repository.full_name == "parlor-game/parlor" and .head_repository.full_name == "parlor-game/parlor" and
            .event == "push" and .head_branch == "test/smart-lobby-native-ui" and
            .head_sha == "7bc78e326fc7fb4831d2b267adc5a5a913a28ef2"' >/dev/null
          gh api repos/parlor-game/parlor/actions/jobs/137516090912 | jq -e '
            .run_id == 45121464371 and .name == "build (ios, macos-26)" and .conclusion == "success"' >/dev/null
          if [[ "$TARGET" == android ]]; then
            gh api repos/parlor-game/parlor/actions/jobs/137516091055 | jq -e '
              .run_id == 45121464371 and .name == "build (android, ubuntu-24.04)" and .conclusion == "success"' >/dev/null
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.extended_match == 'true' && needs.plan.outputs.reuse_candidate == 'true'
        with:
          github-token: ${{ github.token }}
          repository: parlor-game/parlor
          run-id: '45121464371'
          name: candidate-${{ matrix.target }}-1
          path: ${{ runner.temp }}/parlor-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.observe_reconnect != 'true' && matrix.target == 'ios' && needs.plan.outputs.reuse_candidate == 'true'
        with:
          github-token: ${{ github.token }}
          repository: parlor-game/parlor
          run-id: ${{ needs.plan.outputs.ios_retained_run }}
          name: candidate-ios-1
          path: ${{ runner.temp }}/parlor-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.reuse_candidate != 'true' && (needs.plan.outputs.observe_reconnect == 'true' || matrix.target == 'ios' || needs.plan.outputs.rules_restore_android == 'true')
        with:
          name: candidate-${{ matrix.target }}-1
          path: ${{ runner.temp }}/parlor-package
      - name: Verify the retained Party Night package producer and artifact
        if: needs.plan.outputs.retained_party_night_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retained=repos/parlor-game/parlor/actions
          harness=7d69bff7265964253dcb5b6f137238d58396e53a
          gh api "$retained/runs/45343614595/attempts/1" | jq -e --arg head "$harness" '
            .id == 45343614595 and .workflow_id == 427081574 and .run_attempt == 1 and
            .repository.full_name == "parlor-game/parlor" and .head_repository.full_name == "parlor-game/parlor" and
            .event == "push" and .head_branch == "test/smart-lobby-native-ui" and .head_sha == $head and
            .status == "completed"' >/dev/null
          if [[ "$TARGET" == android ]]; then
            job=138272970054
            name='build (android, ubuntu-24.04)'
            artifact=14896064891
            digest=8169bf4c9aceb26ebff7159686fe873eb44d462790054827ee41f4785d7f1467
          else
            job=138272970022
            name='build (ios, macos-26)'
            artifact=14898460890
            digest=db2b8822d4cfe49fc931a10a3f445577d3d02668d3d08d048a78318af13dff83
          fi
          gh api "$retained/jobs/$job" | jq -e --arg name "$name" --arg head "$harness" '
            .run_id == 45343614595 and .run_attempt == 1 and .name == $name and .head_sha == $head and
            .conclusion == "success"' >/dev/null
          gh api "$retained/artifacts/$artifact" | jq -e --arg name "candidate-$TARGET-1" --arg digest "sha256:$digest" --arg head "$harness" '
            .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == 45343614595 and .workflow_run.head_sha == $head' >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.retained_party_night_run != ''
        with:
          github-token: ${{ github.token }}
          repository: parlor-game/parlor
          run-id: ${{ needs.plan.outputs.retained_party_night_run }}
          name: candidate-${{ matrix.target }}-1
          path: ${{ runner.temp }}/parlor-package
      - name: Verify and extract the retained UI candidate package
        if: needs.plan.outputs.reuse_pr355 == 'true' || needs.plan.outputs.reuse_pr356 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_SHELL_PACKAGE: ${{ needs.plan.outputs.reuse_pr356 }}
        run: |
          retained=repos/parlor-game/parlor/actions
          if [[ "$SHARED_SHELL_PACKAGE" == true ]]; then
            producer=45542121396
            harness=6e8e1f5361ede328a9f3e90783fc9b7c7308f603
            tree=3d7d9c15a24edf137f9d7606aa86df6e86e78a63
            if [[ "$TARGET" == android ]]; then
              job=138963054372
              name='build (android, ubuntu-24.04)'
              artifact=14990201417
              digest=e702f3c30600ff32235837035d9526141a114c2f4f74ae729a5d6cfcc10b1583
              package_digest=a880dceff3580523bfa229b0e3c95289381b3eee4d9e0fcd5c4a0b3be5319ed9
            else
              job=138963054397
              name='build (ios, macos-26)'
              artifact=14991781597
              digest=56d4bd5ed79e5d9a51586be88a0779e8db60e260526aafd6aa66adef75d2d41f
              package_digest=ff39b51d931d7a31f2e410881e7bdd40b67cdcf45790e4f01cc38c05af09ad3f
            fi
          else
            producer=45451672718
            harness=54b13793e93ec15d4b089ae3c6957b5319d126ac
            tree=bb5687eea486fd3277558d3e28b763931b0dfcdd
            if [[ "$TARGET" == android ]]; then
              job=138650426210
              name='build (android, ubuntu-24.04)'
              artifact=14948349888
              digest=107d25a056529af744707623bdf6d6cccd0a6e9fb337484a538db7f5e2fb739a
              package_digest=76fbe0e8dd9a9d661d7698c4317693efd2dcead2bca43b7988d4aac96328f9d3
            else
              job=138650426140
              name='build (ios, macos-26)'
              artifact=14948873916
              digest=b168eda83d19ef80e5ce37ea52f3d851cbaaceca134266d1c2dd6c0da1cbcb4f
              package_digest=0606d88583bbb487d47417f4c820eb03847f2b5f180e6d90d783814e5fa690d7
            fi
          fi
          gh api "$retained/runs/$producer/attempts/1" | jq -e --arg head "$harness" --argjson producer "$producer" '
            .id == $producer and .workflow_id == 427081574 and .run_attempt == 1 and
            .repository.full_name == "parlor-game/parlor" and .head_repository.full_name == "parlor-game/parlor" and
            .event == "push" and .head_branch == "test/smart-lobby-native-ui" and
            .head_sha == $head and .status == "completed"' >/dev/null
          gh api "$retained/jobs/$job" | jq -e --arg name "$name" --arg head "$harness" --argjson producer "$producer" '
            .run_id == $producer and .run_attempt == 1 and .name == $name and .head_sha == $head and
            .conclusion == "success"' >/dev/null
          gh api "$retained/artifacts/$artifact" | jq -e --arg name "candidate-$TARGET-1" --arg digest "sha256:$digest" --arg head "$harness" --argjson producer "$producer" '
            .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $producer and .workflow_run.head_sha == $head' >/dev/null
          archive="$RUNNER_TEMP/parlor-retained.zip"
          package="$RUNNER_TEMP/parlor-package"
          gh api "$retained/artifacts/$artifact/zip" > "$archive"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$package"
          cmp "$package/source.txt" <(printf '%s\n' "$CANDIDATE" "$tree")
          read -r recorded_digest _ < "$package/SHA256SUMS"
          [[ "$recorded_digest" == "$package_digest" ]]
          (cd "$package" && shasum -a 256 -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/parlor-proof"
          printf '%s\t%s\t%s\t%s\t%s\n' "$producer" "$job" "$artifact" "$digest" "$package_digest" \
            > "$RUNNER_TEMP/parlor-proof/retained-package.tsv"
      - name: Initialize the public upstream isolated LAN
        if: matrix.pairing == 'mixed'
        working-directory: ui-client
        run: |
          bash verification/mobile-lan/trial.sh identity "$TARGET"
          if [[ "$TARGET" == android ]]; then bash verification/mobile-lan/trial.sh rendezvous "$TARGET"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.pairing == 'mixed'
        with:
          name: lan-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-lan/public
          if-no-files-found: error
          retention-days: 1
      - name: Install Android emulator host libraries
        if: matrix.target == 'android'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install the verified package independently on every guest
        env:
          DEVICE_COUNT: ${{ matrix.count }}
        run: bash scripts/smart-lobby-native/lab.sh install
      - name: Verify isolated cross-platform transport
        if: matrix.pairing == 'mixed'
        working-directory: ui-client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("verification/mobile-lan/trial.sh")
          original = script.read_text()
          anchor = 'kill -0 "$(cat "$dir/bridge.pid")"'
          if original.count(anchor) != 1:
              raise SystemExit("The pinned bridge process check changed")
          script.write_text(original.replace(anchor, "sudo -n " + anchor))
          if __import__("os").environ["LAN_FAULTS"] == "1":
              # Controller retries have private per-attempt temp directories.
              # Keep the upstream socket owner check against this job's root.
              session = Path("session.py")
              original = session.read_text()
              anchor = 'NetworkControl(Path(network_path), Path(os.environ["RUNNER_TEMP"]))'
              if original.count(anchor) != 1:
                  raise SystemExit("The pinned network controller scope changed")
              session.write_text(original.replace(anchor,
                  'NetworkControl(Path(network_path), Path(os.environ["PARLOR_NETWORK_CONTROL_ROOT"]))'))
          PY
          bash verification/mobile-lan/trial.sh bridge "$TARGET"
          bash verification/mobile-lan/trial.sh verify "$TARGET"
      - name: Observe isolated LAN continuity during native gameplay
        if: matrix.pairing == 'mixed'
        run: |
          if [[ "$TARGET" == ios ]]; then
            nohup bash scripts/smart-lobby-native/lab.sh mixed-lan-probe </dev/null >"$RUNNER_TEMP/parlor-proof/lan-echo.jsonl" &
          else
            setsid bash scripts/smart-lobby-native/lab.sh mixed-lan-probe </dev/null \
            >"$RUNNER_TEMP/parlor-proof/lan-echo.jsonl" &
          fi
          printf '%s\n' "$!" > "$RUNNER_TEMP/mobile-lan/probe.pid"
      - name: Record aggregate LAN and owned listener samples
        if: needs.plan.outputs.observe_reconnect == 'true'
        run: |
          python3 scripts/smart-lobby-native/lan_trace.py </dev/null >"$RUNNER_TEMP/parlor-proof/lan-trace.jsonl" &
          printf '%s\n' "$!" > "$RUNNER_TEMP/mobile-lan/trace.pid"
      - name: Measure guest clock offset before UI actions
        run: python3 scripts/smart-lobby-native/diagnostics.py clock-before
      - name: Stream redacted transport events before starting the iOS UI controller
        if: needs.plan.outputs.observe_reconnect == 'true' && matrix.pairing == 'mixed' && matrix.target == 'ios'
        run: |
          nohup python3 scripts/smart-lobby-native/diagnostics.py stream-ios </dev/null >/dev/null 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/parlor-ios-diagnostics.pid"
      - name: Open independent UI controllers
        id: controllers
        run: python3 scripts/smart-lobby-native/lab.py start
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parlor-ui-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parlor-connections
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.plan.outputs.rules_restore_android == 'true'
        with:
          name: parlor-native-preflight-android-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parlor-proof
          if-no-files-found: error
          retention-days: 7
      - name: Keep all controllers available for visible UI actions
        run: python3 scripts/smart-lobby-native/lab.py hold
      - name: Collect redacted diagnostics before tearing down guests
        if: always() && steps.controllers.outcome == 'success'
        run: |
          if [[ -s "$RUNNER_TEMP/parlor-ios-diagnostics.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/parlor-ios-diagnostics.pid")" 2>/dev/null || true
            rm "$RUNNER_TEMP/parlor-ios-diagnostics.pid"
          fi
          python3 scripts/smart-lobby-native/diagnostics.py capture
      - name: Retire job-owned devices and sessions
        if: always()
        env:
          LAB_PAIRING: ${{ matrix.pairing }}
        run: bash scripts/smart-lobby-native/lab.sh cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parlor-native-proof-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/parlor-proof
            ${{ runner.temp }}/mobile-lan-preflight/traffic.json
            ${{ runner.temp }}/mobile-lan-preflight/android-to-mac.txt
            ${{ runner.temp }}/mobile-lan-preflight/mac-to-android.txt
          retention-days: 7
