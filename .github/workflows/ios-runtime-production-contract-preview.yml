name: iOS runtime Production contract preview

on:
  push:
    branches: [perf/ios-runtime-production-contract]
    paths: ['.github/workflows/ios-runtime-production-contract-preview.yml']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUALIFICATION_SOURCE: ffd8d18171fa11a4e9e097effd78f883285c72f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
      - name: Verify release-system controls at the exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE"
          mkdir -p build/ios-runtime-contract-evidence
          git rev-parse HEAD 'HEAD^{tree}' > build/ios-runtime-contract-evidence/source.txt
          bash scripts/release/validate_release_system.sh 2>&1 | tee build/ios-runtime-contract-evidence/validation.log
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-runtime-production-contract-verification
          path: build/ios-runtime-contract-evidence/
          if-no-files-found: error
          retention-days: 14
